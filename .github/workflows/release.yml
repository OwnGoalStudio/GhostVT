# Tag vX.Y.Z → override Configuration/Version.xcconfig with the tag, build the
# roothide and rootless debs, and attach both to a GitHub Release.
#
# The terminal core comes from the released Lakr233/libghostty-spm package
# (resolved by xcodebuild from Package.resolved), so this checkout is all the
# build needs.

name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out iGhostVT
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Install packaging tools
        run: |
          brew install ldid dpkg xcbeautify
          ldid -h 2>&1 | head -n1 || true
          dpkg-deb --version | head -n1

      # apply-version.sh strips the leading "v" and rejects anything that is
      # not X.Y.Z; the run number keeps CFBundleVersion increasing per build.
      - name: Override version from tag
        if: github.ref_type == 'tag'
        run: make set-version VERSION="${GITHUB_REF_NAME}" BUILD="${{ github.run_number }}"

      # deb → build → check + test (PTY harness), so validation and the test
      # suite gate the packages. The second flavor reuses the incremental build
      # — the binaries are identical, only layout and architecture label differ.
      - name: Build roothide package (iphoneos-arm64e)
        run: make deb-roothide

      - name: Build rootless package (iphoneos-arm64)
        run: make deb-rootless

      - name: Checksums
        run: |
          cd build/Packages
          shasum -a 256 *.deb | tee SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ighostvt-debs
          path: |
            build/Packages/*.deb
            build/Packages/SHA256SUMS
          if-no-files-found: error

      # Create-or-upload with retries: a transient API failure (v0.2.3 died to
      # a 503 here) must not be mistaken for "the release already exists" —
      # only `gh release view` decides which of the two verbs applies.
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(build/Packages/*.deb build/Packages/SHA256SUMS)
          for attempt in 1 2 3 4 5; do
            if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber && exit 0
            else
              gh release create "${GITHUB_REF_NAME}" \
                --title "iGhostVT ${GITHUB_REF_NAME}" \
                --generate-notes \
                "${assets[@]}" && exit 0
            fi
            echo "publish attempt ${attempt} failed; retrying in 20s" >&2
            sleep 20
          done
          echo "could not publish the release after 5 attempts" >&2
          exit 1
